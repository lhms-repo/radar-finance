openapi: 3.0.3
info:
  title: Radar API
  version: 0.1.0
  description: |
    Contrato único entre o backend Go e o frontend React.
    Valores monetários são sempre inteiros em centavos (RN-21).
servers:
  - url: /api
tags:
  - name: auth
  - name: me
  - name: system
  - name: categories
  - name: accounts
  - name: incomes
  - name: cards
  - name: bills
  - name: financings
  - name: agenda
  - name: alelo
  - name: receivables
  - name: savings
  - name: reports
  - name: imports
  - name: market
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Liveness check used by the container health check.
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"

  /auth/groups:
    get:
      operationId: listLoginGroups
      tags: [auth]
      summary: Lists the group names, the first step of entering (RF-01).
      security: []
      responses:
        "200":
          description: Every group, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginGroup"

  /auth/groups/{id}/members:
    get:
      operationId: listLoginMembers
      tags: [auth]
      summary: Lists the people of one group, the second step of entering (RF-01).
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The members of the group, by the order they joined.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginMember"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Signs in as a member of a group with the PIN (RF-01, RN-27).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Ends the current session.
      responses:
        "204":
          description: Signed out.

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Returns the logged in user.
      responses:
        "200":
          description: Logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/group:
    put:
      operationId: switchGroup
      tags: [me]
      summary: Makes another group of the user the active one, without entering again (RF-81).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSwitch"
      responses:
        "200":
          description: The user with the new active group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/preferences:
    patch:
      operationId: updatePreferences
      tags: [me]
      summary: Changes theme and haptic feedback (RNF-14, RNF-25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: System health page data (section 8.5).
      responses:
        "200":
          description: Health data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/backups:
    get:
      operationId: listBackups
      tags: [system]
      summary: Lists the backup copies, newest first (RNF-05).
      responses:
        "200":
          description: Backup copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackup
      tags: [system]
      summary: Runs a manual backup (RNF-07).
      responses:
        "201":
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /system/export:
    get:
      operationId: exportData
      tags: [system]
      summary: Downloads every table as CSV inside a zip file (RNF-18).
      responses:
        "200":
          description: Zip file with one CSV per table.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Lists the category tree in display order (RF-50, RN-18).
      parameters:
        - name: includeInactive
          in: query
          description: Also returns inactive categories, for the management screen.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Top level categories with their subcategories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Creates a category or subcategory (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Renames, changes the icon or activates and deactivates a category (RF-50, RN-18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Deletes a category without entries or subcategories (RN-18).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: moveCategory
      tags: [categories]
      summary: Moves a category under another parent or promotes it to top level (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryMove"
      responses:
        "200":
          description: Moved category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /group:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Returns the active group with its members (RF-79).
      responses:
        "200":
          description: The active group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: renameGroup
      tags: [groups]
      summary: Renames the active group; administrators only (RF-80).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupName"
      responses:
        "200":
          description: The renamed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /groups:
    post:
      operationId: createGroup
      tags: [groups]
      summary: Creates another group with the caller as its administrator; administrators of the active group only (RF-78, RF-80).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupName"
      responses:
        "201":
          description: The new group, which the caller can switch to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /group/members:
    post:
      operationId: addGroupMember
      tags: [groups]
      summary: Adds a person already registered to the active group with the PIN of that person as consent; administrators only (RF-80).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberAdd"
      responses:
        "200":
          description: The group with the new member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /group/people:
    post:
      operationId: createGroupPerson
      tags: [groups]
      summary: Registers a new person with login and PIN and adds it to the active group; administrators only (RF-80).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPersonCreate"
      responses:
        "200":
          description: The group with the new member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /group/members/{id}:
    put:
      operationId: setGroupMemberRole
      tags: [groups]
      summary: Changes the role of a member of the active group, keeping an administrator; administrators only (RF-80).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRoleChange"
      responses:
        "200":
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /group/members/{id}/pin:
    put:
      operationId: resetGroupMemberPin
      tags: [groups]
      summary: Sets a new PIN for a member when the caller administers every group of that member, and lifts any lock (RF-80, RN-27).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinChange"
      responses:
        "204":
          description: PIN changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /persons:
    get:
      operationId: listPersons
      tags: [accounts]
      summary: Lists the people of the active group, holders of accounts and cards (RF-82).
      responses:
        "200":
          description: Members of the active group.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: Lists the bank accounts with their current balance (RF-04, RF-05).
      responses:
        "200":
          description: Accounts, active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Registers a bank account (RF-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Returns one account with its balance (RF-05).
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Edits name, holder, initial balance or active state of an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Deletes an account without entries.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/statement:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAccountStatement
      tags: [accounts]
      summary: Entries of the account in the month, with opening and closing balances (RF-05).
      parameters:
        - name: month
          in: query
          required: true
          description: Month as YYYY-MM.
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Statement of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adjustAccountBalance
      tags: [accounts]
      summary: Sets the balance to the informed value, recording the difference as an adjustment (RF-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentCreate"
      responses:
        "201":
          description: Adjustment entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/expenses:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addAccountExpense
      tags: [accounts]
      summary: Records a one off expense paid from the account (section 5.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transfers:
    post:
      operationId: createTransfer
      tags: [accounts]
      summary: Moves money between two accounts, not counted as income or spending (RF-07, RN-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "201":
          description: Created transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteEntry
      tags: [accounts]
      summary: Deletes an entry; either side of a transfer deletes the whole transfer.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /month-flow:
    get:
      operationId: getMonthFlow
      tags: [accounts]
      summary: Confirmed income and spending of the month in the accounts, without transfers and adjustments (RN-08).
      parameters:
        - name: month
          in: query
          required: true
          description: Month as YYYY-MM.
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Totals of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /incomes:
    get:
      operationId: listIncomes
      tags: [incomes]
      summary: Lists the registered incomes (RF-09, RF-11, RF-12).
      responses:
        "200":
          description: Registered incomes, recurring first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Income"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createIncome
      tags: [incomes]
      summary: Registers a recurring or eventual income (RF-09, RF-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "201":
          description: Created income.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /incomes/month:
    get:
      operationId: getIncomeMonth
      tags: [incomes]
      summary: Expected and received incomes of the month (RF-10, RF-13, RN-13).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Incomes of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeMonth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /incomes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateIncome
      tags: [incomes]
      summary: Replaces the fields of an income; confirmed months keep what was received (RF-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "200":
          description: Updated income.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteIncome
      tags: [incomes]
      summary: Deletes an income without confirmed receipts.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /incomes/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: confirmIncome
      tags: [incomes]
      summary: Confirms the receipt of the income in a month, which then changes the balance (RF-10, RN-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeConfirm"
      responses:
        "201":
          description: Income entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/incomes:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addAccountIncome
      tags: [incomes]
      summary: Records a one off income received in the account (RF-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneOffIncomeCreate"
      responses:
        "201":
          description: Income entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
