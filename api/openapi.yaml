          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createShoppingList
      tags: [market]
      summary: Starts an empty shopping list (RF-71).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListInput"
      responses:
        "201":
          description: Created list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /market/lists/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getShoppingList
      tags: [market]
      summary: A list with its items, not picked first (RF-71).
      responses:
        "200":
          description: List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: renameShoppingList
      tags: [market]
      summary: Renames a list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListInput"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteShoppingList
      tags: [market]
      summary: Deletes a list and its items.
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /market/lists/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addListItem
      tags: [market]
      summary: Puts a product on the list; the same product again adds to its quantity (RF-71).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemInput"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /market/list-items/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateListItem
      tags: [market]
      summary: Changes the quantity of an item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemQuantity"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeListItem
      tags: [market]
      summary: Takes an item off the list.
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /market/list-items/{id}/picked:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setListItemPicked
      tags: [market]
      summary: Marks or unmarks an item as picked (RF-71).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemPicked"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /market/lists/{id}/comparison:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: compareList
      tags: [market]
      summary: Ranking of the markets for the list and the best split among them (RF-72 to RF-75, RN-22 to RN-25).
      responses:
        "200":
          description: Comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /market/lists/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: finishShoppingList
      tags: [market]
      summary: Records the real total as an expense of Compras para casa by account or card, or as an Alelo purchase, and closes the list (RF-77, RN-26).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListFinish"
      responses:
        "204":
          description: Finished.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: radar_session

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or expired session, or wrong credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The person may not take this action, like managing a group without being its administrator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine readable code.
        message:
          type: string
          description: Message in Portuguese, ready to show to the user.

    Ping:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      required: [groupId, userId, pin]
      properties:
        groupId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        pin:
          type: string
          minLength: 1
          maxLength: 12

    LoginGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    LoginMember:
      type: object
      required: [userId, name, hasPin]
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
        hasPin:
          type: boolean
          description: False until an administrator or the terminal sets the PIN.

    GroupRole:
      type: string
      enum: [admin, member]

    GroupSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/GroupRole"

    GroupName:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40

    GroupMember:
      type: object
      required: [userId, login, name, role, weightBp, hasPin]
      properties:
        userId:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/GroupRole"
        weightBp:
          type: integer
          description: Weight in the settlement between members, in basis points (RF-79).
        hasPin:
          type: boolean

    GroupDetail:
      type: object
      required: [id, name, members]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"

    GroupMemberAdd:
      type: object
      required: [login, pin, role]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        pin:
          type: string
          description: The PIN of the person being added, typed by that person as consent (RF-80).
          minLength: 1
          maxLength: 12
        role:
          $ref: "#/components/schemas/GroupRole"

    GroupPersonCreate:
      type: object
      required: [login, name, pin, role]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 60
        pin:
          type: string
          minLength: 4
          maxLength: 6
        role:
          $ref: "#/components/schemas/GroupRole"

    GroupRoleChange:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/GroupRole"

    PinChange:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 6

    GroupSwitch:
      type: object
      required: [groupId]
      properties:
        groupId:
          type: integer
          format: int64

    Theme:
      type: string
      enum: [system, light, dark]

    Me:
      type: object
      required: [id, login, name, theme, haptics, group, groups]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean
        group:
          $ref: "#/components/schemas/GroupSummary"
        groups:
          description: Every group of the user, for the selector (RF-81).
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"

    PreferencesUpdate:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    BackupKind:
      type: string
      enum: [daily, startup, manual]

    Backup:
      type: object
      required: [name, createdAt, sizeBytes, kind]
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/BackupKind"

    Health:
      type: object
      required: [version, startedAt, uptimeSeconds, dbSizeBytes, nextBackupAt, backupKeep]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dbSizeBytes:
          type: integer
          format: int64
        lastBackup:
          $ref: "#/components/schemas/Backup"
        nextBackupAt:
          type: string
          format: date-time
        backupKeep:
          type: integer
        backupError:
          type: string
        backupErrorAt:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: Absent for top level categories.
        name:
          type: string
        icon:
          type: string
          description: Lucide icon name, always present on top level categories.
        active:
          type: boolean
        children:
          type: array
          description: Subcategories, present only on top level categories.
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        parentId:
          type: integer
          format: int64
          description: Parent category; absent creates a top level category, which needs an icon.
        icon:
          type: string
          maxLength: 40

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        icon:
          type: string
          maxLength: 40
        active:
          type: boolean

    CategoryMove:
      type: object
      properties:
        parentId:
          type: integer
          format: int64
          description: New parent; absent promotes the category to top level.
        icon:
          type: string
          maxLength: 40
          description: Icon used when promoting a subcategory without one.

    Month:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      example: "2026-11"

    Cents:
      type: integer
      format: int64
      description: Amount in cents (RN-21).

    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Account:
      type: object
      required: [id, name, personId, personName, initialBalanceCents, balanceCents, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"
        balanceCents:
          $ref: "#/components/schemas/Cents"
        active:
          type: boolean

    AccountCreate:
      type: object
      required: [name, personId, initialBalanceCents]
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"
        active:
          type: boolean

    EntryKind:
      type: string
      enum: [expense, income, adjustment, transfer, invoice_payment, receivable, savings_deposit, savings_withdrawal]

    Entry:
      type: object
      required: [id, accountId, kind, amountCents, date, confirmed, description, createdByName, createdAt]
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/EntryKind"
        amountCents:
          description: Signed cents, positive enters the account and negative leaves it.
          type: integer
          format: int64
        date:
          type: string
          format: date
        confirmed:
          type: boolean
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        parentCategoryName:
          type: string
        categoryIcon:
          type: string
        description:
          type: string
        transferId:
          type: integer
          format: int64
        counterpartAccountName:
          type: string
          description: The other account of a transfer.
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time

    Statement:
      type: object
      required: [month, openingCents, closingCents, entries]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        openingCents:
          $ref: "#/components/schemas/Cents"
        closingCents:
          $ref: "#/components/schemas/Cents"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    AdjustmentCreate:
      type: object
      required: [balanceCents, date]
      properties:
        balanceCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    ExpenseCreate:
      type: object
      required: [amountCents, date, categoryId]
      properties:
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 120

    TransferCreate:
      type: object
      required: [fromAccountId, toAccountId, amountCents, date]
      properties:
        fromAccountId:
          type: integer
          format: int64
        toAccountId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    Transfer:
      type: object
      required: [id, outEntryId, inEntryId]
      properties:
        id:
          type: integer
          format: int64
        outEntryId:
          type: integer
          format: int64
        inEntryId:
          type: integer
          format: int64

    MonthFlow:
      type: object
      required: [month, incomeCents, expenseCents]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        incomeCents:
          $ref: "#/components/schemas/Cents"
        expenseCents:
          $ref: "#/components/schemas/Cents"

    IncomeKind:
      type: string
      enum: [recurring, eventual]

    Income:
      type: object
      required: [id, kind, name, personId, personName, accountId, accountName, amountCents, endingSoon, ended]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        amountCents:
          $ref: "#/components/schemas/Cents"
        day:
          type: integer
          description: Day of receipt of a recurring income.
        startMonth:
          $ref: "#/components/schemas/Month"
        endOn:
          type: string
          format: date
        expectedOn:
          type: string
          format: date
          description: Estimated date of an eventual income.
        endingSoon:
          type: boolean
          description: The end date is within 30 days (RF-12).
        ended:
          type: boolean

    IncomeInput:
      type: object
      required: [kind, name, personId, accountId, amountCents]
      properties:
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
          maxLength: 60
        personId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        day:
          type: integer
        startMonth:
          $ref: "#/components/schemas/Month"
        endOn:
          type: string
          format: date
        expectedOn:
          type: string
          format: date

    IncomeOccurrence:
      type: object
      required: [incomeId, kind, name, personName, accountId, accountName, expectedOn, expectedCents, confirmed]
      properties:
        incomeId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
        personName:
          type: string
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        expectedOn:
          type: string
          format: date
        expectedCents:
          $ref: "#/components/schemas/Cents"
        confirmed:
          type: boolean
        entryId:
          type: integer
          format: int64
        receivedCents:
          $ref: "#/components/schemas/Cents"
        receivedOn:
          type: string
          format: date
        receivedIn:
          type: string
          description: Name of the account that received it.

    OneOffIncome:
      type: object
      required: [entryId, amountCents, date, description, accountName]
      properties:
        entryId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
        accountName:
          type: string

    IncomeMonth:
      type: object
      required: [month, occurrences, oneOffs, pendingCents, receivedCents]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/IncomeOccurrence"
        oneOffs:
          type: array
          items:
            $ref: "#/components/schemas/OneOffIncome"
        pendingCents:
          $ref: "#/components/schemas/Cents"
        receivedCents:
          $ref: "#/components/schemas/Cents"

    IncomeConfirm:
      type: object
      required: [month]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        accountId:
          type: integer
          format: int64

    OneOffIncomeCreate:
      type: object
      required: [amountCents, date]
      properties:
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    CardColor:
      type: string
      description: Color of the card drawing; nubank_croma draws the Nubank Croma face and ignores the finish.
      enum: [graphite, purple, blue, green, red, orange, gold, silver, nubank_croma]

    CardFinish:
      type: string
      enum: [metal, matte]

    CardInput:
      type: object
      required: [name, personId, limitCents, closingDay, dueDay, color, finish]
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        limitCents:
          $ref: "#/components/schemas/Cents"
        closingDay:
          type: integer
        dueDay:
          type: integer
        lastDigits:
          type: string
          description: Last four digits of the card number.
        color:
          $ref: "#/components/schemas/CardColor"
        finish:
          $ref: "#/components/schemas/CardFinish"

    CardUpdate:
      allOf:
        - $ref: "#/components/schemas/CardInput"
        - type: object
          required: [active]
          properties:
            active:
              type: boolean

    Card:
      type: object
      required: [id, name, personId, personName, limitCents, closingDay, dueDay, color, finish, active, limitUsedCents, limitFreeCents, currentInvoice, currentInvoiceDueOn]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        limitCents:
          $ref: "#/components/schemas/Cents"
        closingDay:
          type: integer
        dueDay:
          type: integer
        lastDigits:
          type: string
        color:
          $ref: "#/components/schemas/CardColor"
        finish:
          $ref: "#/components/schemas/CardFinish"
        active:
          type: boolean
        limitUsedCents:
          $ref: "#/components/schemas/Cents"
        limitFreeCents:
          $ref: "#/components/schemas/Cents"
        currentInvoice:
          $ref: "#/components/schemas/Month"
        currentInvoiceDueOn:
          description: Due date of the current invoice (RN-01).
          type: string
          format: date

    InvoiceStatus:
      type: string
      enum: [open, closed, overdue, paid]

    InvoiceItemKind:
      type: string
      enum: [purchase, credit, recurrence]

    InvoiceItem:
      type: object
      required: [kind, merchant, description, number, count, amountCents]
      properties:
        kind:
          $ref: "#/components/schemas/InvoiceItemKind"
        purchaseId:
          type: integer
          format: int64
        recurrenceId:
          type: integer
          format: int64
        date:
          type: string
          format: date
          description: Purchase date, kept only as information (RN-01).
        merchant:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        parentCategoryName:
          type: string
        categoryIcon:
          type: string
        number:
          type: integer
          description: Installment number, zero for recurrences.
        count:
