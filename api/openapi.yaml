openapi: 3.0.3
info:
  title: Radar API
  version: 0.1.0
  description: |
    Contrato único entre o backend Go e o frontend React.
    Valores monetários são sempre inteiros em centavos (RN-21).
servers:
  - url: /api
tags:
  - name: auth
  - name: me
  - name: system
  - name: categories
  - name: accounts
  - name: incomes
  - name: cards
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Liveness check used by the container health check.
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"

  /auth/users:
    get:
      operationId: listLoginUsers
      tags: [auth]
      summary: Lists the users for the "who is using" screen (RF-01).
      security: []
      responses:
        "200":
          description: The users of the couple.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Signs in as one of the users, without password (RF-01).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Ends the current session.
      responses:
        "204":
          description: Signed out.

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Returns the logged in user.
      responses:
        "200":
          description: Logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/preferences:
    patch:
      operationId: updatePreferences
      tags: [me]
      summary: Changes theme and haptic feedback (RNF-14, RNF-25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: System health page data (section 8.5).
      responses:
        "200":
          description: Health data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/backups:
    get:
      operationId: listBackups
      tags: [system]
      summary: Lists the backup copies, newest first (RNF-05).
      responses:
        "200":
          description: Backup copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackup
      tags: [system]
      summary: Runs a manual backup (RNF-07).
      responses:
        "201":
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /system/export:
    get:
      operationId: exportData
      tags: [system]
      summary: Downloads every table as CSV inside a zip file (RNF-18).
      responses:
        "200":
          description: Zip file with one CSV per table.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Lists the category tree in display order (RF-50, RN-18).
      parameters:
        - name: includeInactive
          in: query
          description: Also returns inactive categories, for the management screen.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Top level categories with their subcategories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Creates a category or subcategory (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Renames, changes the icon or activates and deactivates a category (RF-50, RN-18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Deletes a category without entries or subcategories (RN-18).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: moveCategory
      tags: [categories]
      summary: Moves a category under another parent or promotes it to top level (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryMove"
      responses:
        "200":
          description: Moved category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /persons:
    get:
      operationId: listPersons
      tags: [accounts]
      summary: Lists the people of the couple, holders of accounts and cards.
      responses:
        "200":
          description: People of the couple.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: Lists the bank accounts with their current balance (RF-04, RF-05).
      responses:
        "200":
          description: Accounts, active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Registers a bank account (RF-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Returns one account with its balance (RF-05).
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Edits name, holder, initial balance or active state of an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Deletes an account without entries.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/statement:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAccountStatement
      tags: [accounts]
      summary: Entries of the account in the month, with opening and closing balances (RF-05).
      parameters:
        - name: month
          in: query
          required: true
          description: Month as YYYY-MM.
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Statement of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adjustAccountBalance
      tags: [accounts]
      summary: Sets the balance to the informed value, recording the difference as an adjustment (RF-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentCreate"
      responses:
        "201":
          description: Adjustment entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/expenses:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addAccountExpense
      tags: [accounts]
      summary: Records a one off expense paid from the account (section 5.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transfers:
    post:
      operationId: createTransfer
      tags: [accounts]
      summary: Moves money between two accounts, not counted as income or spending (RF-07, RN-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "201":
          description: Created transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteEntry
      tags: [accounts]
      summary: Deletes an entry; either side of a transfer deletes the whole transfer.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /month-flow:
    get:
      operationId: getMonthFlow
      tags: [accounts]
      summary: Confirmed income and spending of the month in the accounts, without transfers and adjustments (RN-08).
      parameters:
        - name: month
          in: query
          required: true
          description: Month as YYYY-MM.
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Totals of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /incomes:
    get:
      operationId: listIncomes
      tags: [incomes]
      summary: Lists the registered incomes (RF-09, RF-11, RF-12).
      responses:
        "200":
          description: Registered incomes, recurring first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Income"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createIncome
      tags: [incomes]
      summary: Registers a recurring or eventual income (RF-09, RF-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "201":
          description: Created income.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /incomes/month:
    get:
      operationId: getIncomeMonth
      tags: [incomes]
      summary: Expected and received incomes of the month (RF-10, RF-13, RN-13).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Month"
      responses:
        "200":
          description: Incomes of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeMonth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /incomes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateIncome
      tags: [incomes]
      summary: Replaces the fields of an income; confirmed months keep what was received (RF-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "200":
          description: Updated income.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteIncome
      tags: [incomes]
      summary: Deletes an income without confirmed receipts.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /incomes/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: confirmIncome
      tags: [incomes]
      summary: Confirms the receipt of the income in a month, which then changes the balance (RF-10, RN-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeConfirm"
      responses:
        "201":
          description: Income entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/{id}/incomes:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addAccountIncome
      tags: [incomes]
      summary: Records a one off income received in the account (RF-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneOffIncomeCreate"
      responses:
        "201":
          description: Income entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"


  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: Lists the cards with limit use and current invoice (RF-14, RF-20).
      responses:
        "200":
          description: Cards, active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCard
      tags: [cards]
      summary: Registers a card (RF-14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Created card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCard
      tags: [cards]
      summary: Returns one card with limit use (RF-20).
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCard
      tags: [cards]
      summary: Replaces the fields of a card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          description: Updated card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCard
      tags: [cards]
      summary: Deletes a card without purchases, recurrences or payments.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cards/{id}/invoices/{month}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: month
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Month"
    get:
      operationId: getInvoice
      tags: [cards]
      summary: Invoice of the due month with every line and totals (RF-19, RN-01).
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{id}/invoices/{month}/payment:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: month
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Month"
    post:
      operationId: payInvoice
      tags: [cards]
      summary: Pays the whole invoice from an account; not counted as spending (RF-21, RN-07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentCreate"
      responses:
        "201":
          description: Paid invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cards/{id}/forecast:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: count
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 24
          default: 12
    get:
      operationId: getCardForecast
      tags: [cards]
      summary: Totals of the next invoices from the current one (RF-23).
      responses:
        "200":
          description: Invoice totals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{id}/purchases:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addPurchase
      tags: [cards]
      summary: Registers a purchase in one or more installments (RF-15, RF-16, RF-18, RN-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Created purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cards/{id}/credits:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addCredit
      tags: [cards]
      summary: Registers a refund or credit on the invoice of its date (RF-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: Created credit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /purchases/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updatePurchase
      tags: [cards]
      summary: Replaces a purchase and regenerates its installments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Updated purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePurchase
      tags: [cards]
      summary: Deletes a purchase or credit with its installments.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{id}/recurrences:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRecurrences
      tags: [cards]
      summary: Recurrences of the card with the current price (RF-17).
      responses:
        "200":
          description: Recurrences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recurrence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addRecurrence
      tags: [cards]
      summary: Registers a recurrence charged on every invoice (RF-17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceInput"
      responses:
        "201":
          description: Created recurrence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recurrences/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateRecurrence
      tags: [cards]
      summary: Edits a recurrence; a new price applies from the current invoice on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceUpdate"
      responses:
        "200":
          description: Updated recurrence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteRecurrence
      tags: [cards]
      summary: Deletes a recurrence that is not on a paid invoice.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: radar_session

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or expired session, or wrong credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine readable code.
        message:
          type: string
          description: Message in Portuguese, ready to show to the user.

    Ping:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      required: [login]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64

    LoginUser:
      type: object
      required: [login, name]
      properties:
        login:
          type: string
        name:
          type: string

    Theme:
      type: string
      enum: [system, light, dark]

    Me:
      type: object
      required: [id, login, name, theme, haptics]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    PreferencesUpdate:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    BackupKind:
      type: string
      enum: [daily, startup, manual]

    Backup:
      type: object
      required: [name, createdAt, sizeBytes, kind]
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/BackupKind"

    Health:
      type: object
      required: [version, startedAt, uptimeSeconds, dbSizeBytes, nextBackupAt, backupKeep]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dbSizeBytes:
          type: integer
          format: int64
        lastBackup:
          $ref: "#/components/schemas/Backup"
        nextBackupAt:
          type: string
          format: date-time
        backupKeep:
          type: integer
        backupError:
          type: string
        backupErrorAt:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: Absent for top level categories.
        name:
          type: string
        icon:
          type: string
          description: Lucide icon name, always present on top level categories.
        active:
          type: boolean
        children:
          type: array
          description: Subcategories, present only on top level categories.
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        parentId:
          type: integer
          format: int64
          description: Parent category; absent creates a top level category, which needs an icon.
        icon:
          type: string
          maxLength: 40

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        icon:
          type: string
          maxLength: 40
        active:
          type: boolean

    CategoryMove:
      type: object
      properties:
        parentId:
          type: integer
          format: int64
          description: New parent; absent promotes the category to top level.
        icon:
          type: string
          maxLength: 40
          description: Icon used when promoting a subcategory without one.

    Month:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      example: "2026-11"

    Cents:
      type: integer
      format: int64
      description: Amount in cents (RN-21).

    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Account:
      type: object
      required: [id, name, personId, personName, initialBalanceCents, balanceCents, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"
        balanceCents:
          $ref: "#/components/schemas/Cents"
        active:
          type: boolean

    AccountCreate:
      type: object
      required: [name, personId, initialBalanceCents]
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        initialBalanceCents:
          $ref: "#/components/schemas/Cents"
        active:
          type: boolean

    EntryKind:
      type: string
      enum: [expense, income, adjustment, transfer, invoice_payment]

    Entry:
      type: object
      required: [id, accountId, kind, amountCents, date, confirmed, description, createdByName, createdAt]
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/EntryKind"
        amountCents:
          description: Signed cents, positive enters the account and negative leaves it.
          type: integer
          format: int64
        date:
          type: string
          format: date
        confirmed:
          type: boolean
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        parentCategoryName:
          type: string
        categoryIcon:
          type: string
        description:
          type: string
        transferId:
          type: integer
          format: int64
        counterpartAccountName:
          type: string
          description: The other account of a transfer.
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time

    Statement:
      type: object
      required: [month, openingCents, closingCents, entries]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        openingCents:
          $ref: "#/components/schemas/Cents"
        closingCents:
          $ref: "#/components/schemas/Cents"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    AdjustmentCreate:
      type: object
      required: [balanceCents, date]
      properties:
        balanceCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    ExpenseCreate:
      type: object
      required: [amountCents, date, categoryId]
      properties:
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 120

    TransferCreate:
      type: object
      required: [fromAccountId, toAccountId, amountCents, date]
      properties:
        fromAccountId:
          type: integer
          format: int64
        toAccountId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    Transfer:
      type: object
      required: [id, outEntryId, inEntryId]
      properties:
        id:
          type: integer
          format: int64
        outEntryId:
          type: integer
          format: int64
        inEntryId:
          type: integer
          format: int64

    MonthFlow:
      type: object
      required: [month, incomeCents, expenseCents]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        incomeCents:
          $ref: "#/components/schemas/Cents"
        expenseCents:
          $ref: "#/components/schemas/Cents"

    IncomeKind:
      type: string
      enum: [recurring, eventual]

    Income:
      type: object
      required: [id, kind, name, personId, personName, accountId, accountName, amountCents, endingSoon, ended]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        amountCents:
          $ref: "#/components/schemas/Cents"
        day:
          type: integer
          description: Day of receipt of a recurring income.
        startMonth:
          $ref: "#/components/schemas/Month"
        endOn:
          type: string
          format: date
        expectedOn:
          type: string
          format: date
          description: Estimated date of an eventual income.
        endingSoon:
          type: boolean
          description: The end date is within 30 days (RF-12).
        ended:
          type: boolean

    IncomeInput:
      type: object
      required: [kind, name, personId, accountId, amountCents]
      properties:
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
          maxLength: 60
        personId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        day:
          type: integer
        startMonth:
          $ref: "#/components/schemas/Month"
        endOn:
          type: string
          format: date
        expectedOn:
          type: string
          format: date

    IncomeOccurrence:
      type: object
      required: [incomeId, kind, name, personName, accountId, accountName, expectedOn, expectedCents, confirmed]
      properties:
        incomeId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/IncomeKind"
        name:
          type: string
        personName:
          type: string
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        expectedOn:
          type: string
          format: date
        expectedCents:
          $ref: "#/components/schemas/Cents"
        confirmed:
          type: boolean
        entryId:
          type: integer
          format: int64
        receivedCents:
          $ref: "#/components/schemas/Cents"
        receivedOn:
          type: string
          format: date
        receivedIn:
          type: string
          description: Name of the account that received it.

    OneOffIncome:
      type: object
      required: [entryId, amountCents, date, description, accountName]
      properties:
        entryId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
        accountName:
          type: string

    IncomeMonth:
      type: object
      required: [month, occurrences, oneOffs, pendingCents, receivedCents]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/IncomeOccurrence"
        oneOffs:
          type: array
          items:
            $ref: "#/components/schemas/OneOffIncome"
        pendingCents:
          $ref: "#/components/schemas/Cents"
        receivedCents:
          $ref: "#/components/schemas/Cents"

    IncomeConfirm:
      type: object
      required: [month]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        accountId:
          type: integer
          format: int64

    OneOffIncomeCreate:
      type: object
      required: [amountCents, date]
      properties:
        amountCents:
          $ref: "#/components/schemas/Cents"
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 120

    CardColor:
      type: string
      enum: [graphite, purple, blue, green, red, orange, gold, silver]

    CardFinish:
      type: string
      enum: [metal, matte]

    CardInput:
      type: object
      required: [name, personId, limitCents, closingDay, dueDay, color, finish]
      properties:
        name:
          type: string
          maxLength: 40
        personId:
          type: integer
          format: int64
        limitCents:
          $ref: "#/components/schemas/Cents"
        closingDay:
          type: integer
        dueDay:
          type: integer
        lastDigits:
          type: string
          description: Last four digits of the card number.
        color:
          $ref: "#/components/schemas/CardColor"
        finish:
          $ref: "#/components/schemas/CardFinish"

    CardUpdate:
      allOf:
        - $ref: "#/components/schemas/CardInput"
        - type: object
          required: [active]
          properties:
            active:
              type: boolean

    Card:
      type: object
      required: [id, name, personId, personName, limitCents, closingDay, dueDay, color, finish, active, limitUsedCents, limitFreeCents, currentInvoice]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        personId:
          type: integer
          format: int64
        personName:
          type: string
        limitCents:
          $ref: "#/components/schemas/Cents"
        closingDay:
          type: integer
        dueDay:
          type: integer
        lastDigits:
          type: string
        color:
          $ref: "#/components/schemas/CardColor"
        finish:
          $ref: "#/components/schemas/CardFinish"
        active:
          type: boolean
        limitUsedCents:
          $ref: "#/components/schemas/Cents"
        limitFreeCents:
          $ref: "#/components/schemas/Cents"
        currentInvoice:
          $ref: "#/components/schemas/Month"

    InvoiceStatus:
      type: string
      enum: [open, closed, overdue, paid]

    InvoiceItemKind:
      type: string
      enum: [purchase, credit, recurrence]

    InvoiceItem:
      type: object
      required: [kind, merchant, description, number, count, amountCents]
      properties:
        kind:
          $ref: "#/components/schemas/InvoiceItemKind"
        purchaseId:
          type: integer
          format: int64
        recurrenceId:
          type: integer
          format: int64
        date:
          type: string
          format: date
          description: Purchase date, kept only as information (RN-01).
        merchant:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        parentCategoryName:
          type: string
        categoryIcon:
          type: string
        number:
          type: integer
          description: Installment number, zero for recurrences.
        count:
          type: integer
          description: Number of installments, zero for recurrences.
        amountCents:
          description: Signed cents; credits are negative.
          type: integer
          format: int64
        purchaseTotalCents:
          $ref: "#/components/schemas/Cents"
        buyerPersonId:
          type: integer
          format: int64
        buyerName:
          type: string
        createdByName:
          type: string

    InvoicePayment:
      type: object
      required: [entryId, accountId, accountName, paidOn, amountCents]
      properties:
        entryId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        paidOn:
          type: string
          format: date
        amountCents:
          $ref: "#/components/schemas/Cents"

    Invoice:
      type: object
      required: [cardId, month, closingOn, dueOn, status, totalCents, thirdPartyCents, receivedCents, pendingCents, netCents, items, paymentOutdated]
      properties:
        cardId:
          type: integer
          format: int64
        month:
          $ref: "#/components/schemas/Month"
        closingOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        totalCents:
          $ref: "#/components/schemas/Cents"
        thirdPartyCents:
          $ref: "#/components/schemas/Cents"
        receivedCents:
          $ref: "#/components/schemas/Cents"
        pendingCents:
          $ref: "#/components/schemas/Cents"
        netCents:
          $ref: "#/components/schemas/Cents"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        payment:
          $ref: "#/components/schemas/InvoicePayment"
        paymentOutdated:
          type: boolean
          description: The total changed after the payment was recorded.

    InvoiceSummary:
      type: object
      required: [month, dueOn, status, totalCents]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        dueOn:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        totalCents:
          $ref: "#/components/schemas/Cents"

    InvoicePaymentCreate:
      type: object
      required: [accountId, date]
      properties:
        accountId:
          type: integer
          format: int64
        date:
          type: string
          format: date

    PurchaseInput:
      type: object
      required: [date, merchant, categoryId, amountCents, installments]
      properties:
        date:
          type: string
          format: date
        merchant:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 120
        categoryId:
          type: integer
          format: int64
        buyerPersonId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        installments:
          type: integer
          minimum: 1
          maximum: 48
        perInstallment:
          type: boolean
          description: amountCents is the value of each installment instead of the total.

    CreditInput:
      type: object
      required: [date, merchant, amountCents]
      properties:
        date:
          type: string
          format: date
        merchant:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 120
        categoryId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"

    Purchase:
      type: object
      required: [id, cardId, kind, date, merchant, description, totalCents, installments, firstInvoice]
      properties:
        id:
          type: integer
          format: int64
        cardId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [purchase, credit]
        date:
          type: string
          format: date
        merchant:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        buyerPersonId:
          type: integer
          format: int64
        totalCents:
          $ref: "#/components/schemas/Cents"
        installments:
          type: integer
        firstInvoice:
          $ref: "#/components/schemas/Month"

    RecurrenceInput:
      type: object
      required: [description, categoryId, amountCents, startDate]
      properties:
        description:
          type: string
          maxLength: 80
        categoryId:
          type: integer
          format: int64
        amountCents:
          $ref: "#/components/schemas/Cents"
        startDate:
          type: string
          format: date
          description: The first charge goes to the invoice of this date.
        endMonth:
          $ref: "#/components/schemas/Month"

    RecurrenceUpdate:
      type: object
      required: [description, categoryId, amountCents]
      properties:
        description:
          type: string
          maxLength: 80
        categoryId:
          type: integer
          format: int64
        amountCents:
