openapi: 3.0.3
info:
  title: Radar API
  version: 0.1.0
  description: |
    Contrato único entre o backend Go e o frontend React.
    Valores monetários são sempre inteiros em centavos (RN-21).
servers:
  - url: /api
tags:
  - name: auth
  - name: me
  - name: system
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Liveness check used by the container health check.
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Signs in with login and password (RF-01).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed attempts for this login.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Ends the current session.
      responses:
        "204":
          description: Signed out.

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Returns the logged in user.
      responses:
        "200":
          description: Logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/preferences:
    patch:
      operationId: updatePreferences
      tags: [me]
      summary: Changes theme and haptic feedback (RNF-14, RNF-25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: System health page data (section 8.5).
      responses:
        "200":
          description: Health data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/backups:
    get:
      operationId: listBackups
      tags: [system]
      summary: Lists the backup copies, newest first (RNF-05).
      responses:
        "200":
          description: Backup copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackup
      tags: [system]
      summary: Runs a manual backup (RNF-07).
      responses:
        "201":
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /system/export:
    get:
      operationId: exportData
      tags: [system]
      summary: Downloads every table as CSV inside a zip file (RNF-18).
      responses:
        "200":
          description: Zip file with one CSV per table.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: radar_session

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or expired session, or wrong credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine readable code.
        message:
          type: string
          description: Message in Portuguese, ready to show to the user.

    Ping:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    Theme:
      type: string
      enum: [system, light, dark]

    Me:
      type: object
      required: [id, login, name, theme, haptics]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    PreferencesUpdate:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    BackupKind:
      type: string
      enum: [daily, startup, manual]

    Backup:
      type: object
      required: [name, createdAt, sizeBytes, kind]
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/BackupKind"

    Health:
      type: object
      required: [version, startedAt, uptimeSeconds, dbSizeBytes, nextBackupAt, backupKeep]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dbSizeBytes:
          type: integer
          format: int64
        lastBackup:
          $ref: "#/components/schemas/Backup"
        nextBackupAt:
          type: string
          format: date-time
        backupKeep:
          type: integer
        backupError:
          type: string
        backupErrorAt:
          type: string
          format: date-time

security:
  - session: []
