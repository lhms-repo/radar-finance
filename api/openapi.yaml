openapi: 3.0.3
info:
  title: Radar API
  version: 0.1.0
  description: |
    Contrato único entre o backend Go e o frontend React.
    Valores monetários são sempre inteiros em centavos (RN-21).
servers:
  - url: /api
tags:
  - name: auth
  - name: me
  - name: system
  - name: categories
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Liveness check used by the container health check.
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"

  /auth/users:
    get:
      operationId: listLoginUsers
      tags: [auth]
      summary: Lists the users for the "who is using" screen (RF-01).
      security: []
      responses:
        "200":
          description: The users of the couple.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Signs in as one of the users, without password (RF-01).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Ends the current session.
      responses:
        "204":
          description: Signed out.

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Returns the logged in user.
      responses:
        "200":
          description: Logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/preferences:
    patch:
      operationId: updatePreferences
      tags: [me]
      summary: Changes theme and haptic feedback (RNF-14, RNF-25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: System health page data (section 8.5).
      responses:
        "200":
          description: Health data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/backups:
    get:
      operationId: listBackups
      tags: [system]
      summary: Lists the backup copies, newest first (RNF-05).
      responses:
        "200":
          description: Backup copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackup
      tags: [system]
      summary: Runs a manual backup (RNF-07).
      responses:
        "201":
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /system/export:
    get:
      operationId: exportData
      tags: [system]
      summary: Downloads every table as CSV inside a zip file (RNF-18).
      responses:
        "200":
          description: Zip file with one CSV per table.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Lists the category tree in display order (RF-50, RN-18).
      parameters:
        - name: includeInactive
          in: query
          description: Also returns inactive categories, for the management screen.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Top level categories with their subcategories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Creates a category or subcategory (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Renames, changes the icon or activates and deactivates a category (RF-50, RN-18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Deletes a category without entries or subcategories (RN-18).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: moveCategory
      tags: [categories]
      summary: Moves a category under another parent or promotes it to top level (RF-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryMove"
      responses:
        "200":
          description: Moved category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: radar_session

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or expired session, or wrong credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine readable code.
        message:
          type: string
          description: Message in Portuguese, ready to show to the user.

    Ping:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      required: [login]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64

    LoginUser:
      type: object
      required: [login, name]
      properties:
        login:
          type: string
        name:
          type: string

    Theme:
      type: string
      enum: [system, light, dark]

    Me:
      type: object
      required: [id, login, name, theme, haptics]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    PreferencesUpdate:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        haptics:
          type: boolean

    BackupKind:
      type: string
      enum: [daily, startup, manual]

    Backup:
      type: object
      required: [name, createdAt, sizeBytes, kind]
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/BackupKind"

    Health:
      type: object
      required: [version, startedAt, uptimeSeconds, dbSizeBytes, nextBackupAt, backupKeep]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        dbSizeBytes:
          type: integer
          format: int64
        lastBackup:
          $ref: "#/components/schemas/Backup"
        nextBackupAt:
          type: string
          format: date-time
        backupKeep:
          type: integer
        backupError:
          type: string
        backupErrorAt:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: Absent for top level categories.
        name:
          type: string
        icon:
          type: string
          description: Lucide icon name, always present on top level categories.
        active:
          type: boolean
        children:
          type: array
          description: Subcategories, present only on top level categories.
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        parentId:
          type: integer
          format: int64
          description: Parent category; absent creates a top level category, which needs an icon.
        icon:
          type: string
          maxLength: 40

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        icon:
          type: string
          maxLength: 40
        active:
          type: boolean

    CategoryMove:
      type: object
      properties:
        parentId:
          type: integer
          format: int64
          description: New parent; absent promotes the category to top level.
        icon:
          type: string
          maxLength: 40
          description: Icon used when promoting a subcategory without one.

security:
  - session: []
